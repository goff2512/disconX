<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAN Chess</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="lobby" hidden>
    <h1><span class="logo">♞</span> LAN Chess</h1>
    <p class="sub">Two players, one home network.</p>
    <label class="field">Your name
      <input id="name" maxlength="20" placeholder="optional" autocomplete="nickname">
    </label>
    <button id="create" class="primary">Create new game</button>
    <form id="joinForm" class="join">
      <input id="code" maxlength="12" placeholder="Game code" autocapitalize="characters" autocomplete="off">
      <button type="submit">Join</button>
    </form>
    <p class="hint" id="addrs"></p>
  </main>

  <main id="game" hidden>
    <section class="board-wrap">
      <div class="player" id="topPlayer"></div>
      <div id="board" role="grid" aria-label="Chess board"></div>
      <div class="player" id="bottomPlayer"></div>
    </section>
    <aside class="panel">
      <div id="status" aria-live="polite"></div>
      <label class="switch"><input type="checkbox" id="coachToggle"><span class="track"></span> Learning mode</label>
      <div id="coach" hidden>
        <div id="coachText"></div>
        <div class="coach-row">
          <button id="hintBtn" type="button">💡 Hint</button>
          <span class="legend"><i class="lg-red"></i>danger <i class="lg-green"></i>you can win it</span>
        </div>
      </div>
      <div id="actions"></div>
      <ol id="moves"></ol>
      <div class="invite">
        <div class="label">Invite link — game <strong id="roomCode"></strong></div>
        <div class="row"><code id="link"></code><button id="copy" type="button">Copy</button></div>
      </div>
      <div class="foot">
        <button id="flip" type="button" class="ghost">Flip board</button>
        <a href="./" class="ghost">Leave</a>
        <span id="conn" class="conn"></span>
      </div>
    </aside>
  </main>

  <div id="promo" class="modal" hidden>
    <div class="modal-box">
      <p>Promote to</p>
      <div id="promoChoices"></div>
    </div>
  </div>
  <div id="confirm" class="modal" hidden>
    <div class="modal-box confirm-box">
      <p id="confirmText"></p>
      <div class="coach-row">
        <button id="confirmNo" type="button" class="primary">Pick another move</button>
        <button id="confirmYes" type="button">Move anyway</button>
      </div>
    </div>
  </div>
  <div id="toast" hidden></div>

  <script src="chess.js"></script>
  <script src="coach.js"></script>
  <script src="app.js"></script>
</body>
</html>
